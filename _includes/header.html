<!-- Design note: reference-led, public-facing research wayfinding with a circular crest and teal masthead. -->
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ site.baseurl }}/" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/images/myphone-mybrain-horizontal-alpha.png' | relative_url }}" alt="MyPhone MyBrain">
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a href="{{ '/take-part/' | relative_url }}">Take part</a>
      <a href="{{ '/take-part/parent-carer/' | relative_url }}">Parents and carers</a>
      <a href="{{ '/take-part/young-person/' | relative_url }}">Young people</a>
      <a href="{{ '/study/' | relative_url }}">About the study</a>
      <a href="{{ '/faq/' | relative_url }}">Questions</a>
      <a href="{{ '/myself/' | relative_url }}" class="nav-cta">MySelf survey</a>
    </nav>

    <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-nav">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

<!-- Mobile nav lives outside the header to avoid stacking-context issues -->

  <button class="mobile-nav-close" aria-label="Close navigation menu">
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  <nav class="mobile-nav-inner" aria-label="Mobile navigation">
    <a href="{{ site.baseurl }}/">Home</a>
    <a href="{{ '/take-part/young-person/' | relative_url }}">I have been invited</a>
    <a href="{{ '/take-part/parent-carer/' | relative_url }}">My child has been invited</a>
    <a href="{{ '/myself/' | relative_url }}">MySelf survey</a>
    <a href="{{ '/study/' | relative_url }}">About the study</a>
    <a href="{{ '/faq/' | relative_url }}">Questions</a>
    <a href="{{ '/contact/' | relative_url }}" class="mobile-nav-cta">Need help? Contact us &nbsp;&rarr;</a>
  </nav>
</div>
