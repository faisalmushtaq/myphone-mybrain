<!-- Design note: reference-led, public-facing research wayfinding with a circular crest and teal masthead. -->
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ site.baseurl }}/" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/images/myphone-mybrain-logo.png' | relative_url }}" alt="MyPhone MyBrain">
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a href="{{ '/study/' | relative_url }}">The study</a>
      <a href="{{ '/participation/' | relative_url }}">How it works</a>
      <a href="{{ '/schools/' | relative_url }}">For schools</a>
      <a href="{{ '/families/' | relative_url }}">For families</a>
      <a href="{{ '/team/' | relative_url }}">Team</a>
      <a href="{{ '/faq/' | relative_url }}">Questions</a>
      <a href="{{ '/schools/#signup' | relative_url }}" class="nav-cta">Register interest</a>
    </nav>

    <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-nav">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>

    <span class="bar"></span>
  </button>
  <nav class="mobile-nav-inner" aria-label="Mobile navigation">
    <a class="mobile-menu-brand" href="{{ site.baseurl }}/" aria-label="MyPhone/MyBrain home"><img src="{{ '/assets/images/myphone-mybrain-logo.png' | relative_url }}" alt="MyPhone MyBrain"></a>

    <a href="{{ '/young-people/' | relative_url }}">For young people</a>
    <a href="{{ '/team/' | relative_url }}">Team</a>
    <a href="{{ '/faq/' | relative_url }}">Questions</a>
    <a href="{{ '/resources/' | relative_url }}">Resources</a>
    <a href="{{ '/contact/' | relative_url }}">Contact</a>
    <a href="{{ '/schools/#signup' | relative_url }}" class="mobile-nav-cta">Register your school &nbsp;&rarr;</a>
  </nav>
</div>
