<!-- Design note: compact, sticky, logo-led masthead patterned on the stable EEG101 navigation behaviour. -->
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ site.baseurl }}/" aria-label="{{ site.title }} home">
      <img src="{{ '/assets/images/logo/myphone-mybrain-logo.png' | relative_url }}" srcset="{{ '/assets/images/logo/myphone-mybrain-logo.png' | relative_url }} 1x, {{ '/assets/images/logo/myphone-mybrain-logo@2x.png' | relative_url }} 2x, {{ '/assets/images/logo/myphone-mybrain-logo@3x.png' | relative_url }} 3x" width="210" height="62" alt="MyPhone MyBrain">
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a href="{{ '/study/' | relative_url }}">About the study</a>
      <a href="{{ '/young-people/' | relative_url }}">Young people</a>
      <a href="{{ '/families/' | relative_url }}">Families</a>
      <a href="{{ '/schools/' | relative_url }}">Schools</a>
      <a href="{{ '/faq/' | relative_url }}">Questions</a>
      <a href="{{ '/contact/' | relative_url }}" class="nav-cta">Contact</a>
    </nav>

    <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-nav">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>

  <nav class="mobile-nav-overlay" id="mobile-nav" aria-label="Mobile navigation" aria-hidden="true">
    <div class="container mobile-nav-inner">
      <a href="{{ '/study/' | relative_url }}">About the study</a>
      <a href="{{ '/young-people/' | relative_url }}">For young people</a>
      <a href="{{ '/families/' | relative_url }}">For parents and carers</a>
      <a href="{{ '/schools/' | relative_url }}">For schools</a>
      <a href="{{ '/faq/' | relative_url }}">Questions</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </div>
  </nav>
</header>
