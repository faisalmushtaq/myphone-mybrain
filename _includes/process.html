<section id="participation" class="section section-dark">
  <div class="container">
    <div class="reveal section-heading">
      <p class="section-kicker light">Taking part</p>
      <h2>One session. Two parts. Real science.</h2>
      <div class="prose prose-light">
        {{ site.data.content.process_intro | markdownify }}
      </div>
    </div>
    <figure class="section-photo-banner section-photo-banner--short illustration-banner reveal">
      <img src="{{ '/assets/images/illustrations/eeg-session.jpg' | relative_url }}"
           alt="Illustration of a young person taking part in a friendly EEG research session with a researcher"
           loading="lazy">
    </figure>
    <div class="step-grid">
      {% for step in site.data.content.steps %}
      <article class="step-card reveal">
        <span>{{ step.number }}</span>
        <h3>{{ step.title }}</h3>
        <p>{{ step.body }}</p>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
