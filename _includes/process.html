<section id="participation" class="section section-dark">
  <div class="container">
    <h2 class="sr-only">How it works</h2>
    <figure class="section-photo-banner section-photo-banner--short illustration-banner reveal">
      <img src="{{ '/assets/images/silhouettes/study.jpg' | relative_url }}"
           alt="Simple silhouettes of a young person and researcher during an EEG research session"
           loading="lazy">
    </figure>
    <div class="step-grid">
      {% for step in site.data.content.steps %}
      <article class="step-card reveal">
        <span>{{ step.number }}</span>
        <h3>{{ step.title }}</h3>
        <p>{{ step.body }}</p>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
