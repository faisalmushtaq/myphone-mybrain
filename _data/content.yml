about:
  heading: "About MyPhone/MyBrain"
  body: |
    **MyPhone/MyBrain** is a four-year research project funded by the Huo Family Foundation. The team is based at the **Centre for Applied Education Research** and the **Wolfson Centre for Applied Health Research**. We work with secondary schools in Bradford and Leeds.

    The project looks at young people's digital lives, wellbeing, learning and brain development. It has two parts, each a separate choice. Young people are invited to MyBrain, a workshop at school, unless a parent or carer opts them out, and decide on the day which parts to do. MyPhone, sharing screen time, is something families opt in to online.

    **MyPhone** asks, as an option, for screenshots of the phone's screen-time page: which apps were used and for how long. They do not show messages, photos, or what was posted or watched, and families can hide any part of a screenshot before it is sent.

    **MyBrain** is part of a workshop at school. A young person wears a lightweight EEG headset, sits quietly for a short time and completes a simple computer task. EEG is safe and painless. The research team brings the equipment and supports pupils throughout.

    For young people who take part in the workshop, we link research data with education and health records through **Connected West Yorkshire**, with the approvals in place; opting out of the workshop also opts out of linking. We use this to look at longer-term patterns in learning, wellbeing and health. We share findings about groups of people. We do not give schools or families individual profiles.

    Professor Faisal Mushtaq at the University of Leeds leads the project. He works with researchers in brain science, data science, education and population research.

why:
  heading: "Why are we doing this?"
  body: |
    Phones and social media are part of many young people's lives. People often have strong views about how they affect wellbeing. Good answers need good evidence.

    We want to learn from many young people in different schools and communities. We also want to use information that reflects real life, rather than relying only on screen-time estimates.

    Our aim is to produce careful, useful evidence for young people, families, schools and people who make decisions about education and health. We will share what we learn clearly and responsibly.

# What a workshop looks like (/participation/ and /schools/): from the approved information sheets and a school's own account of a session.
session_timeline:
  intro: "In a classroom at school, run by our researchers with our equipment, and already tested in 8 schools with more than 1,000 students. Every part is a choice: young people can say no to any part, or stop at any time."
  stages:
    - title: "How the brain works"
      kind: "Talk"
      body: "A short, interactive introduction from neuroscientists: how the brain works, and how scientists study what it is doing."
    - title: "A live demonstration"
      kind: "Demonstration"
      body: "A researcher fits a lightweight EEG headset on a volunteer and the brain’s electrical signals appear live on screen. Clench your jaw and every line jumps."
    - title: "Fitting the headsets"
      kind: "Hands-on"
      body: "Pupils who want to take part fit lightweight EEG headsets on each other, with the researchers’ help. Hair never needs to be cut or shaved."
    - title: "Seeing their own signals"
      kind: "Viewing the signal"
      body: "Each pupil watches their own brain’s signals on a laptop, and sees how they change when they relax or concentrate."
    - title: "The recording and the tasks"
      kind: "Tasks"
      body: "A few quiet minutes with eyes open and closed, then simple computer tasks about attention and self-control, such as pressing a key for some pictures and holding back for others."
    - title: "Questionnaires"
      kind: "About 10 minutes"
      body: "Short questionnaires about their background, wellbeing and everyday life, including how they use their phone."
    - title: "Ask the researchers"
      kind: "Careers"
      body: "Time to ask the team anything: about the brain, about research, and about how they got into science."

# A school's own account of a session, with its students' words (published by the college).
school_voice:
  school: "Notre Dame Catholic Sixth Form College, Leeds"
  who: "Lower Sixth A-level Psychology students"
  url: "https://www.notredamecoll.ac.uk/news/citizen-neuroscience-project"
  link_text: "Read Notre Dame’s story about their session"
  quotes:
    - "An informative workshop, I got to see my own brain signals. I am considering a career in psychology so this tool might be something I use again in the future."
    - "I learnt how focusing on tasks change the brain waves - this can be helpful with studying and trying to focus."
    - "The EEG session was interesting and fun to do, like how all of the monitors went off when clenching the jaw."

