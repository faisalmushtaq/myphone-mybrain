about:
  heading: "About MyPhone/MyBrain"
  body: |
    **MyPhone/MyBrain** is a four-year research project funded by the Huo Family Foundation. The team is based at the **Centre for Applied Education Research** and the **Wolfson Centre for Applied Health Research**. We work with secondary schools in Bradford and Leeds.

    The project looks at young people's digital lives, wellbeing, learning and brain development. Young people can choose whether to take part in the MyPhone part, the MyBrain part, or both.

    **MyPhone** may include a secure donation of a summary of social media use. This can show when a young person uses a platform, how they interact with it and the types of content they see.

    **MyBrain** is an EEG session at school. A young person wears an EEG cap, sits quietly for a short time and completes simple computer tasks. EEG is safe and painless. The research team brings the equipment and supports pupils throughout.

    With the right consent and approvals, we may link research data to education and health records through **Connected West Yorkshire**. We use this to look at longer-term patterns in learning, wellbeing and health. We share findings about groups of people. We do not give schools or families individual profiles.

    Professor Faisal Mushtaq at the University of Leeds leads the project. He works with researchers in brain science, data science, education and population research.

why:
  heading: "Why are we doing this?"
  body: |
    Phones and social media are part of many young people's lives. People often have strong views about how they affect wellbeing. Good answers need good evidence.

    We want to learn from many young people in different schools and communities. We also want to use information that reflects real life, rather than relying only on screen-time estimates.

    Our aim is to produce careful, useful evidence for young people, families, schools and people who make decisions about education and health. We will share what we learn clearly and responsibly.

process_intro: |
  We work with schools in a way that fits their timetable. Trained researchers run the sessions at school. Taking part is always a choice. Families and young people receive information before they decide.

steps:
  - number: "01"
    title: "Talk with the school"
    body: "We talk with the school about timing, year groups, safeguarding and what the school needs. We are inviting secondary schools in Bradford and Leeds."

  - number: "02"
    title: "Share information"
    body: "Parents, carers and pupils receive clear information before anything happens. A parent or carer must give permission, and the young person must agree too."

  - number: "03"
    title: "Run the session"
    body: "The session may include MyPhone and MyBrain. MyPhone can include an optional donation of a social media summary. MyBrain uses an EEG cap and short computer tasks. Young people choose which parts they are happy to do."

  - number: "04"
    title: "Learn from the research"
    body: "With the right consent and approvals, we may link research data to education and health records through Connected West Yorkshire. Some young people may be invited again later. Schools receive updates about group findings."

signup:
  title: "Join the study with your school"
  intro: |
    Secondary schools in **Bradford and Leeds** can join MyPhone/MyBrain. Tell us about your school and we will get in touch to talk it through. Nothing is agreed until you have all the information and want to go ahead.
  email: "brainpop@leeds.ac.uk"
  privacy_note: "We use these details only to reply to you. Before a school joins, the team provides the full study information, consent materials and data protection information."

contact:
  heading: "Get in touch"
  body: |
    Contact the MyPhone/MyBrain team if you have a question about the study, school involvement or information for families. We aim to reply within five working days.

    The team works across Bradford and Leeds. Our Bradford base is the **Wolfson Centre for Applied Health Research** at Bradford Royal Infirmary. The programme is coordinated through the **Centre for Applied Education Research**.

funding_acknowledgement: |
  MyPhone/MyBrain is funded by the **Huo Family Foundation**. We work with the **Born in Bradford** programme, **Connected West Yorkshire** and schools across Bradford and Leeds.
