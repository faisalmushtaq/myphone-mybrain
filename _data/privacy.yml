heading: "Data, privacy and choice"
subheading: "You choose whether to take part and what to share."
intro: |
  MyPhone/MyBrain may use different kinds of information. This can include survey answers, EEG recordings, task results and optional digital data. With the right consent and approvals, it may also include linked education and health records. We explain the information that applies to each activity before anyone decides.

promise:
  - number: "1"
    heading: "Taking part is your choice"
    body: "Young people and families decide whether to take part. Phone data donation is optional and separate from the other parts of the study."
  - number: "2"
    heading: "You decide what feels right"
    body: "Young people can choose the parts of the study they are happy to do. The data donation tool shows participants what they can share."
  - number: "3"
    heading: "We use secure systems"
    body: "We handle digital data through the Smart Data Donation Service. Research data and linked records are stored and analysed in secure systems with controlled access."
  - number: "4"
    heading: "We protect people’s privacy"
    body: "Researchers use coded or anonymous data wherever possible. We share findings about groups of people, rather than individuals."
  - number: "5"
    heading: "Access is carefully controlled"
    body: "Sensitive information is held in secure systems. Approved researchers can only access it through agreed procedures, including those used by Connected Bradford."
  - number: "6"
    heading: "Data are not for sale"
    body: "The project is for research and public benefit. We do not sell data or give it to social media companies for marketing or other commercial use."
  - number: "7"
    heading: "The study does not give personal results"
    body: "The study does not diagnose pupils, rank them or give individual brain or digital profiles to schools or families."
  - number: "8"
    heading: "We will share findings carefully"
    body: "Young people, parent representatives and school leaders will help us decide how to share findings in a fair and respectful way."

data_flow:
  - label: "Permission from pupils and families"
  - label: "MyPhone or MyBrain session"
  - label: "Secure data handling"
  - label: "Research using data without direct personal details"
