- question: "Which schools can take part?"
  answer: |
    We are currently inviting secondary schools in **Bradford and Leeds**. If your school would like to talk with us, use the school form on this website. There is no pressure to take part after an initial conversation.

- question: "Who can take part?"
  answer: |
    The study is for secondary school pupils, usually aged 11 to 18. We work through schools. If a school is interested, we share information with staff, parents, carers and pupils. You can contact us at any time if you have a question.

- question: "What will pupils do?"
  answer: |
    The session may have two parts. In **MyPhone**, young people may donate a secure summary of social media use and complete short surveys. In **MyBrain**, they wear an EEG cap, sit quietly for a short time and complete simple computer tasks. Taking part is always a choice. Young people can choose the parts they want to do and can stop at any time.

- question: "How long does a session take?"
  answer: |
    A session usually takes 45 to 90 minutes. The two parts can take place at different times if this works better for the school. We agree the details with each school and work around timetables and exam periods.

- question: "What is EEG? Is it safe?"
  answer: |
    EEG stands for electroencephalography. It uses small sensors on the scalp to record brain activity. It is safe and painless. It does not send electricity into the brain. EEG is a research tool. It is not a medical procedure.

- question: "Can EEG read thoughts or diagnose anything?"
  answer: |
    No. EEG records patterns of activity at the scalp. It cannot read thoughts, feelings, intentions or personality. The study does not diagnose health conditions, check pupils for difficulties or give individual brain profiles to schools or families.

- question: "Do pupils have to share phone data?"
  answer: |
    No. Phone data donation is optional. Young people can take part in other parts of the study without donating phone data. Their choice will not affect their place at school or their relationship with staff.

- question: "What phone data could be donated?"
  answer: |
    The Smart Data Donation Service can securely collect summaries from platforms such as TikTok and YouTube. These summaries can include when a platform was used, patterns of interaction and types of content seen. They do not include private messages, passwords or account login details. Participants see what is being shared before they decide.

- question: "What happens to the data?"
  answer: |
    The University of Leeds stores and handles data in line with UK data protection law and its own policies. Researchers use secure systems with controlled access. They work with data that do not directly identify a person wherever possible. We do not sell data or give it to social media companies or other commercial organisations.

- question: "What is the Smart Data Donation Service?"
  answer: |
    It is a secure service that lets people choose whether to donate information about their digital activity for research. It shows participants what they can share before they make a decision. It is used by academic research projects.

- question: "What is Connected West Yorkshire?"
  answer: |
    **Connected West Yorkshire** is a research data programme that provides access to linked information through more than one dataset. This can include health, care and education records. If MyPhone/MyBrain uses linked data, the study information will explain what this means, the choices people have and the approvals in place before anyone is asked to agree.

- question: "Can parents or carers say no?"
  answer: |
    Yes. Taking part is a choice. A parent or carer must give permission, and the young person must agree too. Parents and carers can withdraw their child at any time. This will not affect the child's education or relationship with school.

- question: "Can young people withdraw after taking part?"
  answer: |
    Yes. Young people can ask for their data to be withdrawn after a session. We will explain how to do this. It will not affect their place at school or their involvement in other activities.

- question: "How could the school benefit?"
  answer: |
    The session links with science, computing and PSHE. Pupils learn about brain science, research methods and digital data. We can offer a follow-up session to share accessible findings with the school community. Schools can ask for group findings from their cohort at the end of each school year.

- question: "Does the study assess individual pupils?"
  answer: |
    No. The study does not assess academic ability, diagnose health conditions or create individual profiles for schools or families. We report findings about groups of people. The project is for research, rather than clinical or educational assessment.

- question: "Who funds and oversees the project?"
  answer: |
    The **Huo Family Foundation** funds MyPhone/MyBrain. The University of Leeds leads the project with Born in Bradford, the Centre for Applied Education Research and partner schools. We will make relevant study information, privacy materials and approval details available before any activity that needs them begins.

- question: "Who is in the research team?"
  answer: |
    Professor Faisal Mushtaq at the University of Leeds leads the project. Researchers from the University of Leeds, the University of Sheffield, the University of York and Born in Bradford are involved. You can find the full team on the [team page](/myphone-mybrain/team/).

- question: "When will findings be available?"
  answer: |
    The programme runs for four years, including three school years of delivery. We will share updates with participating schools as findings become available. We will also share public summaries and research papers where possible. We want young people, families and schools to be able to understand what we find.

- question: "How can my school get involved?"
  answer: |
    Teachers and school leaders at secondary schools in Bradford or Leeds can use the [school form](/myphone-mybrain/schools/#signup) to contact us. Please only include school contact details. Do not include pupil information. We will reply to talk through next steps.

- question: "How can I ask another question?"
  answer: |
    Use the [contact page](/myphone-mybrain/contact/) to choose the type of question you have and prepare an email to the team. Young people, parents, carers, teachers and researchers are all welcome to contact us. We aim to reply within five working days.
