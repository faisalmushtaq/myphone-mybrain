- question: "Do I have to take part?"
  group: young
  answer: |
    No. It's your choice. You can say no to any part, or stop at any time, even on the day. You don't have to say why, and nobody at school will mind.

- question: "Will you see my messages or what I watch?"
  group: young
  answer: |
    No. If you choose to send screenshots of your phone's Screen Time page, we only see which apps you used and for how long. You can cover up anything first.

- question: "Will my teacher see my answers?"
  group: young
  answer: |
    No. We don't give your answers to your teachers, your school or your friends. We only share results about big groups of young people, never about you.

- question: "What happens at the school session?"
  group: young
  answer: |
    Our researchers visit your school for a two-hour workshop. You learn how the brain works and see a live demonstration of EEG. If you want to, you wear a light headset that records your brain's activity while you sit quietly and do a simple computer task, and you answer some short questionnaires. [See what a session involves](/participation/).

- question: "What if I change my mind?"
  group: young
  answer: |
    That's fine. Tell the researcher or your teacher, even on the day. You don't have to say why. Afterwards, you or your parent or carer can email brainpop@leeds.ac.uk, the MyPhone/MyBrain team's inbox.

- question: "Who can I talk to if something worries me?"
  group: young
  answer: |
    Talk to an adult you trust, at home or at school, or to the researchers when they visit. You can also call Childline free, any time, on 0800 1111.

- question: "Which schools can take part?"
  answer: |
    We are currently inviting secondary schools in **Bradford and Leeds**. If your school would like to talk with us, use the school form on this website. There is no pressure to take part after an initial conversation.

- question: "Who can take part?"
  answer: |
    The study is for secondary school pupils, usually aged 11 to 18. We work through schools. If a school is interested, we share information with staff, parents, carers and pupils. You can contact us at any time if you have a question.

- question: "What will pupils do?"
  answer: |
    Each visit is a two-hour workshop at school, for the classes taking part. Pupils learn how the brain works and see a live demonstration of EEG. Those who agree wear a lightweight headset that records brain activity while they sit quietly and do a simple computer task, and answer brief questionnaires about their background, wellbeing and behaviour. Separately, and only if they choose, families can share screenshots of the phone's screen-time page online. Taking part is always a choice: a parent or carer can opt their child out by email beforehand, and on the day young people choose the parts they want to do and can stop at any time.

- question: "How long does a session take?"
  answer: |
    Each visit is a two-hour workshop for a group of up to 30 pupils, during the school day. We can run up to three in a day, and we plan dates with each school around timetables and exam periods. Schools take part for up to three school years, and each year is a fresh choice.

- question: "What is EEG? Is it safe?"
  answer: |
    EEG stands for electroencephalography. It uses small sensors on the scalp to record brain activity. It is safe and painless. It does not send electricity into the brain. EEG is a research tool. It is not a medical procedure.

- question: "Can EEG read thoughts or diagnose anything?"
  answer: |
    No. EEG records patterns of activity at the scalp. It cannot read thoughts, feelings, intentions or personality. The study does not diagnose health conditions, check pupils for difficulties or give individual brain profiles to schools or families.

- question: "Do pupils have to share phone data?"
  answer: |
    No. Phone data donation is optional, and only happens if the family opts in online: a parent or carer says yes first for under-16s, and 16- and 17-year-olds decide for themselves. Young people take part in the workshop without donating phone data. Their choice will not affect their place at school or their relationship with staff.

- question: "What phone data could be donated?"
  answer: |
    Only if the family opts in online: screenshots of the phone's Screen Time page (iPhone) or Digital Wellbeing page (Android). They show which apps were used and for how long. A parent who can see their child's screen time on their own phone (Apple Family Sharing or Google Family Link) can send it from there; otherwise the young person sends it from their phone, if they want to. Screenshots do not show messages, photos, videos, posts, contacts, or what was watched or searched, and any part of a screenshot can be hidden before it is sent. If the screen time is not shared, we ask the parent a few more questions about their child's phone use instead.

- question: "What happens to the data?"
  answer: |
    The University of Leeds stores and handles data in line with UK data protection law and its own policies. Researchers use secure systems with controlled access. They work with data that do not directly identify a person wherever possible. We do not sell data or give it to social media companies or other commercial organisations.

- question: "What is the Smart Data Donation Service?"
  answer: |
    A secure research environment, run by the University of York, where donated phone-use information, such as screen-time screenshots, can be processed for research. It only works with information people have chosen to donate.

- question: "What is Connected West Yorkshire?"
  answer: |
    **Connected West Yorkshire** is a research data programme that provides access to linked information through more than one dataset. This can include health, care and education records. Linking is part of the study for young people who take part in the workshop, using a code rather than a name and only with the approvals in place. Opting out of the workshop also opts out of linking: without the workshop there is nothing to link.

- question: "Can parents or carers say no?"
  answer: |
    Yes. Every young person in the classes taking part is invited to the workshop unless a parent or carer opts them out. To opt out, a parent or carer emails brainpop@leeds.ac.uk: the [opt-out page](/take-part/consent/?optout=1) explains what your child would miss, and then how. There is no form to fill in and no paper slip. An opt-out after the workshop withdraws your child's information too, as far as is still possible. This will not affect your child's education or relationship with school.

- question: "Can young people withdraw after taking part?"
  answer: |
    Yes. They can stop at any time during a session, without giving a reason. Afterwards, they or their parent or carer can ask for their data to be withdrawn by telling the researchers or emailing brainpop@leeds.ac.uk, quoting their reference if they have one. It will not affect their place at school or their involvement in other activities.

- question: "How could the school benefit?"
  answer: |
    The session links with science, computing and PSHE. Pupils learn about brain science, research methods and digital data. We can offer a follow-up session to share accessible findings with the school community. Schools can ask for group findings from their cohort at the end of each school year.

- question: "Does the study assess individual pupils?"
  answer: |
    No. The study does not assess academic ability, diagnose health conditions or create individual profiles for schools or families. We report findings about groups of people. The project is for research, rather than clinical or educational assessment.

- question: "Who funds and oversees the project?"
  answer: |
    The **Huo Family Foundation** funds MyPhone/MyBrain. The University of Leeds leads the project with Born in Bradford, the Centre for Applied Education Research and partner schools. No research takes place in schools before the study has ethics approval from the University of Leeds School of Psychology Research Ethics Committee, and the University's data protection team signed off the study's data protection impact assessment in May 2026.

- question: "Are the researchers DBS checked?"
  answer: |
    Yes. Everyone from the team who works in schools holds an enhanced DBS certificate, and we send each school the certificates before our first visit. At least two researchers are present at all times, and no researcher is ever alone with a pupil.

- question: "Who is in the research team?"
  answer: |
    Professor Faisal Mushtaq at the University of Leeds leads the project. Researchers from the University of Leeds, the University of Sheffield, the University of York and Born in Bradford are involved. You can find the full team on the [team page](/team/).

- question: "When will findings be available?"
  answer: |
    The programme runs for four years, including three school years of delivery. We will share updates with participating schools as findings become available. We will also share public summaries and research papers where possible. We want young people, families and schools to be able to understand what we find.

- question: "How can my school get involved?"
  answer: |
    Teachers and school leaders at secondary schools in Bradford or Leeds can use the [school form](/schools/#signup) to contact us. We will reply to talk through next steps.

- question: "How can I ask another question?"
  answer: |
    Use the form on the [contact page](/contact/), or email brainpop@leeds.ac.uk, the MyPhone/MyBrain team's inbox. Young people, parents, carers, teachers and researchers are all welcome. We aim to reply within five working days.
