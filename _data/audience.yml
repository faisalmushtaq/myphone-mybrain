signpost:
  heading: "Choose the information for you"
  cards:
    - id: "schools"
      title: "For schools"
      body: "Find out what a school session involves, what our team provides and how to start a conversation with us. We work around school timetables and bring the equipment."
      cta_label: "For schools"
      cta_href: "/schools/"
    - id: "parents"
      title: "For parents and carers"
      body: "Taking part is a choice. We explain the study before you decide, including the data involved, how we keep it safe and the choices your child has."
      cta_label: "For parents and carers"
      cta_href: "/families/"
    - id: "young-people"
      title: "For young people"
      body: "Find out what happens in the study. You decide whether to take part and which parts feel right for you. You can change your mind."
      cta_label: "For young people"
      cta_href: "/young-people/"

for_schools:
  heading: "Information for schools"
  subheading: "A practical partnership that brings real neuroscience into school."
  body: |
    MyPhone/MyBrain works with schools in Bradford and Leeds. We plan the sessions with you, so they fit your timetable, safeguarding arrangements and communication with families.

    Our team brings the equipment and runs the sessions. Before you decide whether to take part, we will explain what is involved and answer your questions.
  benefits:
    - heading: "Learning linked to the curriculum"
      body: "Designed with teachers from Key Stage 3 to Key Stage 5. Pupils explore brain science, measurement, data and research through hands-on activities that link to science, psychology, computing and PSHE."
    - heading: "Beyond the usual curriculum"
      body: "Real neuroscience that pupils rarely get to do at school, with researchers who can talk about university, research and science careers."
    - heading: "A study designed for pupils"
      body: "Young people, parents and teachers have helped shape the project. We have adapted the EEG session for different hair types, religious head coverings and comfort needs."
    - heading: "Useful evidence for the future"
      body: "Your school helps build better evidence about a topic that matters to young people, families and schools."
  gatsby_benchmarks:
    intro: "MyPhone/MyBrain can help schools evidence three Gatsby Benchmarks:"
    benchmarks:
      - number: "4"
        label: "Linking curriculum learning to careers"
        body: "Through curriculum-linked science, psychology, computing and data activities."
      - number: "5"
        label: "Encounters with employers and employees"
        body: "Through meaningful encounters with researchers, research software engineers and data specialists."
      - number: "7"
        label: "Encounters with further and higher education"
        body: "Through direct engagement with university-led research and higher education pathways."
    compass_note: "Schools can record participation within their careers programme using their usual Compass/Compass+ processes."

  what_schools_need: |
    - **Up to three school years.** We visit again each year, and each year your school decides whether to carry on.
    - **Two-hour workshops** for groups of up to 30 pupils, during the school day, from two or more year groups. We can run up to three a day.
    - **A classroom**, and a private room nearby when a pupil needs one.
    - **A named contact** who plans the visits with us, shares our information with families and links with your safeguarding lead.

  session_steps:
    - "Pupils learn how the brain works and how scientists study brain activity."
    - "A live demonstration of EEG (electroencephalography): the brain's signals appear on screen as it happens."
    - "Pupils who agree fit lightweight headsets on each other, with our help, and see their own brain's signals."
    - "A short recording while they sit quietly, then simple computer tasks about attention and self-control."
    - "Brief questionnaires about their background, wellbeing and behaviour, and time to ask the researchers about science and careers."
    - "Separately, and only if the family opts in online, screenshots of the phone's screen-time page: which apps were used and for how long."
  session_note: "Our team brings all the equipment and staff. Every part is a choice: pupils can say no to any part, or stop at any time."

  safeguarding:
    - "Everyone from our team who works in your school holds an enhanced DBS certificate. We send you the certificates before our first visit."
    - "At least two researchers are present at all times, including while setting up and packing away. No researcher is ever alone with a pupil."
    - "We follow your school's child protection, health and safety policies and codes of practice, and ask for copies before we visit."
    - "No research takes place in your school before the study has ethics approval from the University of Leeds School of Psychology Research Ethics Committee. We can send you the approval letter."

  getting_ready:
    - "Before testing begins, we ask staff whether any pupils have disabilities or medical conditions we should know about."
    - "Pupils with a known history of epilepsy or seizures do not take part in the EEG recording, but can join the rest of the workshop."
    - "Pupils should come with clean, dry hair, without gel, oil or spray; long hair can be tied back. Hair never needs to be cut or shaved."
    - "Where needed, the headset can be fitted in a private room, and female researchers are available on request, for comfort or religious reasons."

  school_gets:
    - "A two-hour neuroscience workshop for each group, run by our team with our equipment."
    - "Links with science, computing and PSHE, and evidence towards Gatsby Benchmarks 4, 5 and 7."
    - "Group findings for your school's pupils at the end of each school year, never about individual pupils."
    - "A follow-up session to share what we found with your school community."

  school_link: "When your visit is agreed, your school gets its own page for parents and carers, at an address such as myphonemybrain.com/your-school. It explains the study and opens the online form with your school already filled in. Share it through your usual channels, such as a letter, email or the school app, rather than public social media."

for_parents:
  heading: "Information for parents and carers"
  subheading: "Clear information, real choice and careful data handling."
  intro: |
    MyPhone/MyBrain is about young people's digital lives, brain development and growing up. We know these topics can feel personal. We will give you clear information before you make any decision.

    Every young person in the classes taking part is invited to the MyPhone/MyBrain workshop at school, unless a parent or carer opts them out by email. On the day, your child can still choose some parts and leave out others, and stop at any time. Sharing their screen time is a separate choice you make online, only if you want to. None of this will affect their education, their relationship with school or their access to services.
  what_to_know:
    - "Taking part is a choice: you can opt your child out of the workshop by email."
    - "Opting out of the workshop also opts your child out of linking with health and school records."
    - "Phone data donation is optional: you opt in online."
    - "EEG is safe and painless."
    - "The study is not a medical test."
    - "EEG cannot read thoughts."
    - "The study does not diagnose mental health, ADHD or other conditions."
    - "We share findings about groups, rather than individuals."
    - "We store and analyse data in secure systems."
    - "We do not publish raw social media data openly."
    - "We do not give pupil data to commercial companies."
    - "You can contact the research team at any time."
  consent_note: "If your child's school sent you a link, use it: it explains the study and how to opt out, and opens the online form for sharing screen time with the school already filled in. Need the information in another language, an easier-to-read version or on paper? Contact the team and we will send you what works for you."

for_young_people:
  heading: "Information for young people"
  subheading: "You can help us learn about digital life and growing up."
  intro: |
    MyPhone/MyBrain is a research project about phones, digital life, brains and growing up. We want to understand how different young people use technology and how this links with learning, attention and wellbeing.

    Taking part is your choice. We will explain the study before you decide. You can say no, ask questions or stop at any time. You can choose whether to share your screen time: at 16 or 17 you decide for yourself; if you are younger, your parent or carer says yes first.
  myphone_heading: "MyPhone"
  myphone_items:
    - "You can choose to send screenshots of your phone's Screen Time page. They show which apps you use and for how long."
    - "They don't show your messages, photos or what you watch, and you can cover up anything first. You can say no."
    - "You may complete short surveys about technology, digital habits and wellbeing."
    - "You never have to share anything that makes you uncomfortable."
  mybrain_heading: "MyBrain"
  mybrain_items:
    - "You will take part in a science workshop at school."
    - "You may wear a lightweight EEG headset, which records activity from the surface of your head."
    - "You may sit quietly for a short time and complete simple computer tasks."
    - "Researchers will help you with the equipment."
    - "EEG does not hurt. It does not put anything into your brain. It cannot read your thoughts."
  data_promise_heading: "What we promise"
  data_promise:
    - "We will explain what we are asking you to do."
    - "We will use data only for approved research."
    - "We will protect your privacy."
    - "We will not use the study to judge you."
    - "We will not give your personal data to teachers, classmates or social media companies."
    - "We will share what we learn fairly and respectfully."

coproduction:
  heading: "Designed with young people, families and schools"
  body: |
    Young people, teachers and parents have helped us shape MyPhone/MyBrain. Young people have told us what feels clear and comfortable. Parents have advised us on consent and communication. Teachers and school leaders help make sure the sessions work in real schools.

    The project includes sensitive topics, such as social media data, brain recordings and wellbeing. Young people, parent representatives and schools will help us share findings carefully and in ways that are useful.

inclusion:
  heading: "Designed to include more pupils"
  body: |
    We have tested MyBrain workshops in 8 schools, with more than 1,000 students, and adapted them to support a wide range of pupils. This includes different hair types, religious head coverings, privacy needs and comfort during headset fitting. Pupils can still take part in the learning activities when high-quality EEG data cannot be collected.

impact:
  heading: "What the project will create"
  body: |
    MyPhone/MyBrain will create a carefully managed research resource about digital life, brain activity and growing up. We will share research summaries, tools and information as openly as we can while keeping people’s data safe. We hope this will support better decisions in schools, families, health services and research.
