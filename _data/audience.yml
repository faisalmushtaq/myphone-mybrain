signpost:
  heading: "Choose the information for you"
  cards:
    - id: "schools"
      title: "For schools"
      body: "Find out what a school session involves, what our team provides and how to start a conversation with us. We work around school timetables and bring the equipment."
      cta_label: "For schools"
      cta_href: "/schools/"
    - id: "parents"
      title: "For parents and carers"
      body: "Taking part is a choice. We explain the study before you decide, including the data involved, how we keep it safe and the choices your child has."
      cta_label: "For parents and carers"
      cta_href: "/families/"
    - id: "young-people"
      title: "For young people"
      body: "Find out what happens in the study. You decide whether to take part and which parts feel right for you. You can change your mind."
      cta_label: "For young people"
      cta_href: "/young-people/"

for_schools:
  heading: "Information for schools"
  subheading: "A practical partnership that brings brain science and digital literacy into school."
  body: |
    MyPhone/MyBrain works with schools in Bradford and Leeds. We plan the sessions with you, so they fit your timetable, safeguarding arrangements and communication with families.

    Our team brings the equipment and runs the sessions. Before you decide whether to take part, we will explain what is involved and answer your questions.
  benefits:
    - heading: "Learning linked to the curriculum"
      body: "Pupils explore brain science, measurement, data and research through hands-on activities."
    - heading: "Digital data awareness"
      body: "Pupils learn how digital platforms collect data and how researchers can use data responsibly."
    - heading: "A study designed for pupils"
      body: "Young people, parents and teachers have helped shape the project. We have adapted the EEG session for different hair types, religious head coverings and comfort needs."
    - heading: "Useful evidence for the future"
      body: "Your school helps build better evidence about a topic that matters to young people, families and schools."
  gatsby_benchmarks:
    intro: "Taking part may help your school show work towards three Gatsby Benchmarks in its careers programme."
    benchmarks:
      - number: "4"
        label: "Linking subjects to careers"
        body: "Science, psychology, computing and data activities show how school subjects link to research and STEM careers."
      - number: "5"
        label: "Meeting people at work"
        body: "Pupils meet university researchers, research software engineers and data specialists during the session."
      - number: "7"
        label: "Meeting higher education"
        body: "Pupils see how a university research project works in practice."
    compass_note: "Schools can record participation through their usual Compass or Compass+ process."

  what_schools_need: |
    Schools need a named contact, a suitable space and help with the timetable and safeguarding arrangements. We will also ask you to share approved information with families.

for_parents:
  heading: "Information for parents and carers"
  subheading: "Clear information, real choice and careful data handling."
  intro: |
    MyPhone/MyBrain is about young people's digital lives, brain development and growing up. We know these topics can feel personal. We will give you clear information before you make any decision.

    Your child can only take part if you give permission and they agree on the day. They can choose some parts of the study and leave out others. They can stop at any time. Their choice will not affect their education, their relationship with school or their access to services.
  what_to_know:
    - "Taking part is a choice."
    - "Phone data donation is optional."
    - "EEG is safe and painless."
    - "The study is not a medical test."
    - "EEG cannot read thoughts."
    - "The study does not diagnose mental health, ADHD or other conditions."
    - "We share findings about groups, rather than individuals."
    - "We store and analyse data in secure systems."
    - "We do not publish raw social media data openly."
    - "We do not give pupil data to commercial companies."
    - "You can contact the research team at any time."
  consent_note: "We will share study information, consent forms and privacy information with schools when they are ready. We will provide accessible versions, and multilingual or easy-read versions where possible."

for_young_people:
  heading: "Information for young people"
  subheading: "You can help us learn about digital life and growing up."
  intro: |
    MyPhone/MyBrain is a research project about phones, digital life, brains and growing up. We want to understand how different young people use technology and how this links with learning, attention and wellbeing.

    Taking part is your choice. We will explain the study before you decide. You can say no, ask questions or stop at any time. You can choose whether to donate phone data.
  myphone_heading: "MyPhone"
  myphone_items:
    - "You will learn about the information digital platforms collect about your activity."
    - "You may be able to see a summary of your data from platforms such as TikTok or YouTube."
    - "You choose whether to donate any data for research."
    - "You may complete short surveys about technology, digital habits and wellbeing."
    - "You never have to share anything that makes you uncomfortable."
  mybrain_heading: "MyBrain"
  mybrain_items:
    - "You will take part in a science workshop at school."
    - "You may wear an EEG headset, which records activity from the surface of your head."
    - "You may sit quietly for a short time and complete simple computer tasks."
    - "Researchers will help you with the equipment."
    - "EEG does not hurt. It does not put anything into your brain. It cannot read your thoughts."
  data_promise_heading: "What we promise"
  data_promise:
    - "We will explain what we are asking you to do."
    - "We will use data only for approved research."
    - "We will protect your privacy."
    - "We will not use the study to judge you."
    - "We will not give your personal data to teachers, classmates or social media companies."
    - "We will share what we learn fairly and respectfully."

coproduction:
  heading: "Designed with young people, families and schools"
  body: |
    Young people, teachers and parents have helped us shape MyPhone/MyBrain. Young people have told us what feels clear and comfortable. Parents have advised us on consent and communication. Teachers and school leaders help make sure the sessions work in real schools.

    The project includes sensitive topics, such as social media data, brain recordings and wellbeing. Young people, parent representatives and schools will help us share findings carefully and in ways that are useful.

inclusion:
  heading: "Designed to include more pupils"
  body: |
    We have tested MyBrain workshops in schools and adapted them to support a wide range of pupils. This includes different hair types, religious head coverings, privacy needs and comfort during headset fitting. Pupils can still take part in the learning activities when high-quality EEG data cannot be collected.

legacy:
  heading: "What the project will create"
  body: |
    MyPhone/MyBrain will create a carefully managed research resource about digital life, brain activity and growing up. We will share research summaries, tools and information as openly as we can while keeping people’s data safe. We hope this will support better decisions in schools, families, health services and research.
