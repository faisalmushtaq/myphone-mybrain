partners:
  - name: "Centre for Applied Education Research (CAER)"
    category: "Coordinating centre"
    logo: "logos/caer.png"
    description: "CAER coordinates MyPhone/MyBrain from the Wolfson Centre for Applied Health Research at Bradford Royal Infirmary. Its team brings researchers, educators and decision-makers together to improve understanding of children's learning and development."
    url: "https://www.leedsbeckett.ac.uk/research/centre-for-applied-education-research/"

  - name: "Born in Bradford / Age of Wonder"
    category: "Research partner"
    logo: "logos/born_bradford.png"
    description: "Born in Bradford has followed many families in Bradford since 2007. Its Age of Wonder programme focuses on adolescence. MyPhone/MyBrain works with the Born in Bradford team."
    url: "https://borninbradford.nhs.uk/"

  - name: "University of Leeds"
    category: "Academic partner"
    logo: "logos/leeds.png"
    description: "The academic team is based at the University of Leeds. The University supports research with schools and communities across the region."
    url: "https://www.leeds.ac.uk/"

  - name: "McGill University"
    category: "Academic partner"
    logo: "logos/mcgill.jpg"
    description: "McGill University contributes knowledge about adolescent brain development and cognitive neuroscience. Its researchers help shape the study and analyse brain recording data."
    url: "https://www.mcgill.ca/"

  - name: "Connected Bradford"
    category: "Data platform"
    logo: "logos/connected-bradford.png"
    description: "Connected Bradford is a research data platform that brings together health, education and social care records for people in Bradford. With the right consent and approvals, it may help us study longer-term outcomes."
    url: "https://connectedbradford.nhs.uk/"

  - name: "Smart Data Donation Service"
    category: "Technology partner"
    logo: "logos/sdds.png"
    description: "The Smart Data Donation Service lets people choose whether to donate information about their digital activity for research. It shows them what they can share before they decide."
    url: "https://sdds.ac.uk/"

  - name: "Partner schools"
    category: "Participation partners"
    description: "Partner schools help us plan practical details, communicate with families and decide how to share findings. Schools in Bradford and Leeds are central to the project."
    url: "/schools/#signup"

  - name: "Young people, parents and community advisors"
    category: "Community partners"
    description: "Young people and parents have helped shape the study. Community advisors help us make sure the information is clear, useful and trustworthy."
    url: "/young-people/"

funders:
  - name: "Huo Family Foundation"
    category: "Funder"
    logo: "logos/huo.jpg"
    description: "The Huo Family Foundation funds MyPhone/MyBrain to support research that benefits young people and communities."
    url: "https://huofamilyfoundation.org/"
