what_we_learn:
  heading: "What we want to learn"
  items:
    - number: "1"
      heading: "How do young people use digital technology?"
      body: "We will use donated platform summaries, young people's reflections and short surveys to learn when, how and why young people use digital technology."
    - number: "2"
      heading: "How does brain activity change as young people grow up?"
      body: "MyBrain sessions record brain activity at school while pupils rest and complete short tasks. This helps us learn about attention, self-control and how brain activity changes during adolescence."
    - number: "3"
      heading: "How do digital life, brain activity and daily life connect?"
      body: "With the right permissions, we may link research data to education and health records through secure systems, including Connected Bradford. This helps us look at learning, wellbeing and attention over time."
    - number: "4"
      heading: "How can we share findings fairly?"
      body: "We will share findings carefully with schools, families, young people, researchers and people who make decisions. The study does not diagnose, screen or label individual pupils."

aims:
  heading: "Research aims"
  items:
    - number: "Aim 1"
      body: "Run a school research project that brings together optional phone data, brain recordings and other research information."
    - number: "Aim 2"
      body: "Learn about different patterns of digital technology use across the study group."
    - number: "Aim 3"
      body: "Learn how brain activity varies at different ages and for young people from different backgrounds."
    - number: "Aim 4"
      body: "Explore links between digital life, brain activity, learning, attention, mental health and wellbeing over time."
