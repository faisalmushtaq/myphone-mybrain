name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consent-app/package-lock.json

      - name: Build consent app
        run: npm ci && npm run build
        working-directory: consent-app
        env:
          # The Firebase settings (VITE_MPMB_BACKEND, VITE_FIREBASE_*) live in
          # consent-app/.env.production, written by firebase/scripts/setup-project.sh
          # and committed: they are public identifiers, access is governed by the rules.
          # Without that file the site is built against the in-memory mock.
          # The live site has no draft markers or prototype controls (docs/decisions.md).
          # Repository → Settings → Variables: MPMB_PROTOTYPE=true brings them back for a review build.
          MPMB_PROTOTYPE: ${{ vars.MPMB_PROTOTYPE || 'false' }}

      - name: Build Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Every PDF on the site is made here, from the pages just built, on every publish (7 November 2026: "any time
      # changes are made to the web pages the PDFs are updated"). So a PDF can never be older than its page, a failure
      # stops the publish (the live site and its PDFs stay as they were, together); each step tries twice first, in
      # case Chrome stumbles.
      # The information sheet: one for everyone, one per school (consent-app/scripts/info-sheet-pdf.mjs).
      - name: Information sheet PDFs
        run: node scripts/info-sheet-pdf.mjs ../_site || { echo "retrying"; sleep 5; node scripts/info-sheet-pdf.mjs ../_site; }
        working-directory: consent-app
        env:
          CHROME_CHANNEL: chrome

      # The main information pages (_data/page_pdfs.json, consent-app/scripts/page-pdf.mjs).
      - name: Page PDFs
        run: node scripts/page-pdf.mjs ../_site || { echo "retrying"; sleep 5; node scripts/page-pdf.mjs ../_site; }
        working-directory: consent-app
        env:
          CHROME_CHANNEL: chrome

      # Every PDF the site links to must exist, and be newer than this build's pages.
      - name: Check the PDFs
        run: |
          missing=0
          for f in $(grep -rhoE 'href="/[^"]+\.pdf"' _site --include=*.html | sed -E 's/href="(.*)"/\1/' | sort -u); do
            if [ ! -s "_site$f" ]; then echo "missing: $f"; missing=1; elif [ "_site$f" -ot "_site/index.html" ]; then echo "older than the pages: $f"; missing=1; else echo "ok: $f"; fi
          done
          exit $missing

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages sometimes takes longer than the default 10 minutes to publish (5 November 2026).
          timeout: 1800000
