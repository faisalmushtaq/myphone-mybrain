name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consent-app/package-lock.json

      - name: Build consent app
        run: npm ci && npm run build
        working-directory: consent-app
        env:
          # The Firebase settings (VITE_MPMB_BACKEND, VITE_FIREBASE_*) live in
          # consent-app/.env.production, written by firebase/scripts/setup-project.sh
          # and committed: they are public identifiers, access is governed by the rules.
          # Without that file the site is built against the in-memory mock.
          # Repository → Settings → Variables: MPMB_PROTOTYPE=false removes the prototype controls.
          MPMB_PROTOTYPE: ${{ vars.MPMB_PROTOTYPE || 'true' }}

      - name: Build Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
