name: Deploy Firebase backend

# Deploys the security rules and Cloud Functions in consent-app/firebase to
# the study's Firebase project: automatically when a push to main touches
# them, or by hand from the Actions tab.
#
# Authentication is keyless (Workload Identity Federation), set up once with
# consent-app/firebase/scripts/setup-github-deploys.sh. Nothing secret is
# stored in GitHub. Optional repository variables for the functions'
# environment: MPMB_VISION (true/false), MPMB_ENFORCE_APP_CHECK (true/false),
# and for the emails to the team about website enquiries MPMB_SMTP_USER,
# MPMB_MAIL_TO, MPMB_SMTP_HOST, MPMB_SMTP_PORT (the password itself is stored
# in Secret Manager by consent-app/firebase/scripts/set-mail-password.sh).
on:
  push:
    branches: [main]
    paths:
      - "consent-app/firebase/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - everything
          - rules only
          - functions only
        default: everything

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: myphone-mybrain
  REGION: europe-west2
  WORKLOAD_IDENTITY_PROVIDER: projects/904206810525/locations/global/workloadIdentityPools/github/providers/github-repo
  SERVICE_ACCOUNT: github-deploy@myphone-mybrain.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consent-app/firebase/functions/package-lock.json

      - name: Install and test the functions
        run: npm ci && npm test
        working-directory: consent-app/firebase/functions

      - name: Write the functions environment
        run: |
          {
            echo "MPMB_VISION=${{ vars.MPMB_VISION || 'false' }}"
            echo "MPMB_VISION_ENDPOINT=eu-vision.googleapis.com"
            echo "MPMB_ENFORCE_APP_CHECK=${{ vars.MPMB_ENFORCE_APP_CHECK || 'false' }}"
            echo "MPMB_SMTP_HOST=${{ vars.MPMB_SMTP_HOST || 'smtp.gmail.com' }}"
            echo "MPMB_SMTP_PORT=${{ vars.MPMB_SMTP_PORT || '465' }}"
            echo "MPMB_SMTP_USER=${{ vars.MPMB_SMTP_USER || 'brainpopresearch@gmail.com' }}"
            echo "MPMB_MAIL_TO=${{ vars.MPMB_MAIL_TO || 'brainpop@leeds.ac.uk' }}"
            echo "MPMB_MAIL_FROM_NAME=MyPhone/MyBrain"
            echo "MPMB_SMTP_SECRET=mpmb-smtp-password"
          } > consent-app/firebase/functions/.env

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        working-directory: consent-app/firebase
        run: |
          case "${{ inputs.target }}" in
            "rules only") only="firestore:rules,storage" ;;
            "functions only") only="functions" ;;
            *) only="firestore:rules,storage,functions" ;;
          esac
          npx --yes firebase-tools@15 deploy --only "$only" --project "$PROJECT_ID" --non-interactive --force

      - name: Keep the callables reachable from the website
        if: ${{ inputs.target != 'rules only' }}
        run: |
          for fn in submitconsent submitdonation enquiry; do
            gcloud run services add-iam-policy-binding "$fn" --region="$REGION" --member=allUsers --role=roles/run.invoker --project="$PROJECT_ID" --quiet >/dev/null
          done

      - name: Check the functions answer
        if: ${{ inputs.target != 'rules only' }}
        run: |
          for fn in submitConsent submitDonation enquiry; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$REGION-$PROJECT_ID.cloudfunctions.net/$fn" -H 'Content-Type: application/json' -H 'Origin: https://myphonemybrain.com' -d '{}')
            echo "$fn → http $code"
            case "$code" in 400|401) ;; *) echo "unexpected status for $fn"; exit 1 ;; esac
          done
          # The website's contact and school forms post from another origin, so
          # the browser's preflight request must be allowed for the site.
          headers=$(curl -s -o /dev/null -D - -X OPTIONS "https://$REGION-$PROJECT_ID.cloudfunctions.net/enquiry" -H 'Origin: https://myphonemybrain.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')
          if echo "$headers" | grep -qi '^access-control-allow-origin: https://myphonemybrain.com'; then
            echo "enquiry → preflight from the website allowed"
          else
            echo "enquiry does not allow the website's origin:"; echo "$headers"; exit 1
          fi
