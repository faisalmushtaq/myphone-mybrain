title: "MyPhone/MyBrain"
tagline: "A research project about digital life, brain development and growing up in Bradford and Leeds."
description: "MyPhone/MyBrain is a University of Leeds research project about how digital life connects with brain development, wellbeing and learning. We work with secondary schools in Bradford and Leeds."
email: "brainpop@leeds.ac.uk"
# The contact and school forms post here (the enquiry Cloud Function in consent-app/firebase). Empty = fall back to an email draft.
enquiry_endpoint: "https://europe-west2-myphone-mybrain.cloudfunctions.net/enquiry"

baseurl: ""
url: "https://myphonemybrain.com"

og_image: "/assets/images/og-image.png"

markdown: kramdown
permalink: pretty

plugins: []

exclude:
  - consent-app
  - README.md

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
