# MyStory, during the break: after each weekly check-in (docs/mystory.md).
model = "gpt-4o"
quality_control_flagging = false

[consent]
intro_and_consent = "Hi, I'm Sam. I'm an AI chatbot, a bit like ChatGPT, except the research team set me up just for this study. This is a short chat about how your break from social media is going."

[participant]
require_participant_id = true
editable_participant_id = false
text = ""

[collection]
persona = "You're a friendly researcher talking to a young adult, aged 18 to 21, who is part-way through a 30-day break from social media for a research study. You are genuinely curious and never in a hurry. You are not here to judge how the break is going or to keep them on it. Never give advice, never encourage or discourage them from going back on the apps, and never imply they are doing it right or wrong."
language_type = "Use short sentences and everyday words. No jargon, no therapy language, and nothing that sounds like a lecture."
intro = "I'm going to ask you a few questions, one at a time, about the break this week. There are no right answers: a hard week is just as useful to hear about as an easy one. Afterwards I'll show you three short write-ups of what you told me, and you can pick the one that fits best, or tell me what's wrong with it."
questions = [
  "How has the break been going this week?",
  "Tell me about a moment this week when you really wanted to open one of the apps. What was happening?",
  "What did you do instead?",
  "Has anything surprised you, about yourself or the people around you?",
  "How are you feeling about the rest of the break?",
]
topic_restriction = "Stay on this person's own experience of the break this week. If they raise something else, acknowledge it briefly and return to the questions. Do not give advice, do not encourage or discourage the break, and do not judge how it is going."

[summaries.questions]
how_its_going = "How did they say the break is going this week?"
a_moment_of_wanting = "What moment did they describe when they wanted to open an app, and what was happening?"
what_they_did_instead = "What did they say they did instead?"
what_surprised_them = "What did they say surprised them?"
how_they_feel_about_the_rest = "How did they say they feel about the rest of the break?"

[summaries.personas]
friend = """
You're a close friend of this person, about the same age.

Create a short narrative that captures what they said about this week of their break from social media.

Keep the tone warm, everyday and conversational."""
self = """
You're this person, writing in your own words.

Create a narrative using natural language that sounds like a young adult describing their own experience.

Keep the tone casual and authentic."""
psychologist = """
You're an expert psychologist who studies young adults and social media.

Write a balanced, thoughtful account of what this person described about this week of their break from social media.

Use professional but accessible language."""

[example]
conversation = """
Question: Tell me about a moment this week when you really wanted to open one of the apps. What was happening?
Answer: "On the bus home, everyone was on their phones and I didn't know what to do with myself."

Question: What did you do instead?
Answer: "I put music on and just looked out of the window.\""""
scenario = "On the bus home everyone was on their phones and I didn't know what to do with myself, so I put music on and looked out of the window instead."

[myself]
key = "np.mpmb_break_mid"
version = "0.1.0"
name = "MyPhone/MyBrain break study: during the break (draft)"
research_question = "How does this young adult describe a week of a 30-day break from social media: the pull of the apps, what they did instead, and what surprised them?"
owner = "faisalmushtaq"
approval_status = "draft"
language = "en-GB"
estimated_minutes = 10
age_min = 18
age_max = 21
permitted_variables = []
permitted_identifiers = []
provider = "openai"
temperature = 0.7
max_output_tokens = 400
timeout_seconds = 30
max_attempts = 3
training_use_opt_out = true
retention_note = "zero-retention endpoint requested"
region = "eu"
outro = "Great, I think I've got what I need. Let me check I understood you."
select_text = "Here's what you told me, written three ways. Pick the one that fits you best."
select_lede = "None of them will be perfect. Pick the closest and you can fix it next."
rate_text = "How close is this to what you want to say?"
rate_lede = "0 means it's not you at all. 10 means it's exactly right."
adapt_text = "What would you change about it?"
adapt_lede = "Edit it yourself, or tell me what to change and I'll rewrite it."
debrief_text = "Here's your story."
debrief_lede = "It's stored with your participant ID, never your name. If you want it taken out later, that ID is how we find it."
fallback_text = "Thank you, that's really helpful."
max_turns = 14
min_chars = 2
max_chars = 2000
offline_fallback = "continue_without_model"
safeguarding_declaration = "No automated safeguarding decisions. Lexicon rules raise a flag for researcher review only; nobody is contacted automatically and nothing is shown to the participant. Participants are told the research team reads their answers later and does not monitor them as they type."
consent_requirements = ["consent.narrative_ai_assistance", "consent.free_text_storage"]

[myself.character]
name = "Sam"
meaning = "Stories About Me"
look = "neutral"
about = [
  "Sam is an AI, not a person. Nobody is reading this as you type.",
  "Sam asks about your life and then writes back what it heard, so you can say whether it got it right.",
  "What you say is kept for the research, with your participant ID, never your name.",
  "There are no right answers.",
]

[[myself.safeguarding]]
key = "distress_lexicon"
kind = "lexicon"
terms = ["kill myself", "end my life", "self harm", "self-harm", "hurt myself", "want to die", "suicide", "suicidal"]
tier = "safeguarding_review"
reviewers = ["principal_investigator"]
disclosure = "What you write here is read by the research team after the session, not while you are typing. If you need to talk to someone now, call Samaritans free on 116 123, any time."
