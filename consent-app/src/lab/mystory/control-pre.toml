fallback_text = "Thank you, that is really helpful."
max_turns = 25
min_chars = 2
max_chars = 2000
max_chars_per_second = 15
long_message_chars = 250
flag_above_share = 0.3
stop_before_generation = true
offline_fallback = "continue_without_model"
safeguarding_declaration = "No automated safeguarding decisions and no live monitoring. Participants are told in the consent form, the information sheet and at the start of the chat that nobody reads the chat as they type, that the researchers cannot provide support in the moment, that they can reach out to the listed support services or to a friend or family member, and that they can withdraw at any time. If a participant discloses suicidal thoughts, self-harm or distress, the model stops the questions, responds with empathy, gives the pre-approved support message and offers to pause, or carry on. If a participant describes something upsetting that is not a crisis, the model responds with care, gives the pre-approved signposting sentence and checks they are okay to carry on. Lexicon rules flag the transcript for researcher review only. When a flagged or concerning transcript is found during analysis, the researcher completes an incident report (date of the interaction, participant ID, date found, description), informs the supervisor, and checks whether the model's risk response fired correctly. Participants are anonymous and are not contacted, unless the disclosure is a risk of harm to a child or vulnerable adult, in which case the safeguarding lead is contacted."
consent_requirements = ["consent.narrative_ai_assistance", "consent.free_text_storage"]

